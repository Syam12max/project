<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>

<body>

    <h1>Technical Workshop Registration</h1>

    <form>

        <label>Student Name:</label>
        <input type="text" name="studentname">
        <br><br>

        <label>Roll Number:</label>
        <input type="text" name="rollnumber">
        <br><br>

        <label>Email:</label>
        <input type="email" name="email">
        <br><br>

        <label>Phone Number:</label>
        <input type="tel" name="phone">
        <br><br>

        <label>Gender:</label>
        
        <input type="radio" name="gender" value="male">
        Male

        <input type="radio" name="gender" value="female">
        Female

        <br><br>

        <label>Department:</label>

        <select name="department">
            <option value="">Select Department</option>
            <option value="cse">CSE</option>
            <option value="ece">ECE</option>
            <option value="eee">EEE</option>
            <option value="mech">Mechanical</option>
            <option value="civil">Civil</option>
        </select>

        <br><br>

        <label>Choose Skills:</label>
        <br>

        <input type="checkbox" name="skill" value="html">
        HTML

        <input type="checkbox" name="skill" value="css">
        CSS

        <input type="checkbox" name="skill" value="javascript">
        JavaScript

        <input type="checkbox" name="skill" value="java">
        Java

        <br><br>

        <label>Workshop:</label>

        <select name="workshop">
            <option value="">Select Workshop</option>
            <option value="web">Web Development</option>
            <option value="python">Python Programming</option>
            <option value="java">Java Programming</option>
            <option value="ai">Artificial Intelligence</option>
        </select>

        <br><br>

        <label>Address:</label>
        <br>

        <textarea name="address" rows="4" cols="40"></textarea>

        <br><br>

        <input type="submit" value="Register">

        <input type="reset" value="Reset">

    </form>

</body>
</html>
