<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSphere Premium // Learning Management System</title>
    <style>
        /* Premium Core Design Architecture Variables */
        :root {
            --bg-base: #090d16;
            --bg-surface: #111827;
            --bg-surface-elevated: #1f2937;
            --accent-primary: #6366f1;
            --accent-primary-hover: #4f46e5;
            --accent-success: #10b981;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #374151;
            --radius-lg: 12px;
            --radius-md: 8px;
            --font-stack: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-stack);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Bar Navigation Structural Layout */
        nav {
            height: 70px;
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: #fff;
        }

        .brand span {
            background: linear-gradient(to right, #818cf8, var(--accent-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .global-metrics {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            background: rgba(255, 255, 255, 0.03);
            padding: 0.5rem 1.25rem;
            border-radius: 9999px;
            border: 1px solid var(--border-color);
            font-size: 0.85rem;
        }

        .metric-badge span {
            color: var(--accent-success);
            font-weight: 700;
        }

        /* Platform Splitting Application Container */
        .app-window {
            display: flex;
            flex: 1;
            height: calc(100vh - 70px);
            overflow: hidden;
        }

        /* Left Side Content Suite (Player + Interaction Panel) */
        .content-suite {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            background-color: #0c101b;
        }

        .video-viewport {
            background-color: #000;
            aspect-ratio: 16 / 9;
            max-height: 60vh;
            width: 100%;
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Tabbed Interaction Frame Work */
        .workspace-tabs {
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .tab-headers {
            display: flex;
            gap: 1.5rem;
            border-bottom: 2px solid var(--border-color);
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 600;
            padding-bottom: 0.75rem;
            cursor: pointer;
            position: relative;
            transition: color 0.2s;
        }

        .tab-btn:hover {
            color: #fff;
        }

        .tab-btn.active {
            color: var(--accent-primary);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--accent-primary);
        }

        .tab-panel {
            display: none;
            line-height: 1.6;
        }

        .tab-panel.active {
            display: block;
        }

        /* Functional Forum Components */
        .qa-input-box {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        input[type="text"] {
            flex: 1;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 0.75rem 1rem;
            color: white;
            font-family: inherit;
        }

        .primary-action-btn {
            background-color: var(--accent-primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .primary-action-btn:hover {
            background-color: var(--accent-primary-hover);
        }

        .forum-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .forum-post {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: var(--radius-md);
        }

        .forum-user {
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--accent-primary);
            margin-bottom: 0.25rem;
        }

        /* Right Side Navigation Course Syllabus Sidebar */
        .syllabus-sidebar {
            width: 400px;
            background-color: var(--bg-surface);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .sidebar-meta {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-meta h2 {
            font-size: 1.15rem;
            margin-bottom: 0.75rem;
        }

        .progress-track-bg {
            background-color: var(--border-color);
            height: 6px;
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-track-fill {
            background-color: var(--accent-success);
            height: 100%;
            width: 0%;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .curriculum-tree {
            flex: 1;
            overflow-y: auto;
        }

        /* Accordion Structural Tree Layout Elements */
        .chapter-node {
            border-bottom: 1px solid var(--border-color);
        }

        .chapter-header {
            background-color: rgba(255, 255, 255, 0.01);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            user-select: none;
        }

        .chapter-header:hover {
            background-color: rgba(255, 255, 255, 0.03);
        }

        .chapter-lessons-list {
            display: block; /* Managed implicitly through class assignments toggle fields */
            background-color: rgba(0, 0, 0, 0.15);
        }

        .chapter-lessons-list.hidden {
            display: none;
        }

        .lesson-row {
            display: flex;
            align-items: flex-start;
            padding: 0.9rem 1.5rem;
            gap: 1rem;
            cursor: pointer;
            border-top: 1px solid rgba(55, 65, 81, 0.2);
            transition: all 0.2s;
        }

        .lesson-row:hover {
            background-color: rgba(99, 102, 241, 0.05);
        }

        .lesson-row.active {
            background-color: rgba(99, 102, 241, 0.12);
            border-left: 4px solid var(--accent-primary);
        }

        /* Checkbox Execution Designs */
        .checkbox-container {
            width: 18px;
            height: 18px;
            border: 2px solid var(--text-muted);
            border-radius: 4px;
            margin-top: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .lesson-row.completed .checkbox-container {
            background-color: var(--accent-success);
            border-color: var(--accent-success);
        }

        .lesson-row.completed .checkbox-container::after {
            content: "✓";
            color: white;
            font-size: 0.7rem;
            font-weight: 900;
        }

        .lesson-txt-wrapper {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }

        .lesson-txt-title {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .lesson-txt-duration {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .lesson-row.completed .lesson-txt-title {
            color: var(--text-muted);
            text-decoration: line-through;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 99px; }
    </style>
</head>

    <nav>
        <div class="brand">🚀 <span>EduSphere Pro</span></div>
        <div class="global-metrics">
