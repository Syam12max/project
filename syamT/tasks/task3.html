<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>looping concept</title>
</head>
<body>
    <script>
// Task: Quiz
let questions =[
    "what is HTML?",
    "what is css?",
    "what is javascript?",
    "what is array?"
];
let answers=[
    "it is markup language.",
    "it is used to add styling to HTML.",
    "it is a scripting language used to make a web pages interective.",
    "it is used to store multiple values in a single variable."
];
for(let a=0; a < questions.length; a++){
    console.log("question: " + questions[a]);
    console.log("answer:" + answers[a]);
    console.log("---------------------");
}
    </script>
</body>
</html>
