<html>
    <head><title>form practice</title>
    <link rel="stylesheet" href="formP.css">
    </head>
    <body>
        <form>
            <h1> registration form</h1>
          <label for="name">full name</label> 
            <input type="text" placeholder="full name"><br><br>
          <label for="age">age</label>
           <input type="number" id="age" placeholder="age"><br><br>
           <label for="email">email:</label>
           <input type="email" id="email" placeholder="name123@gmail.com"><br><br>
           <label for="psd">password:</label>
           <input type="password" id="psd" placeholder="password"><br><br>
           <label for="mobile">phone number:</label>
           <input type="tel" id="mobile" placeholder="phone number"><br><br>
           
           <label>gender:</label>
           <input type="radio" name="gender" value="male">
           <label for="male">male:</label>
           <input type="radio" name="gender" value="female">
           <label for="female">female:</label>
                 
           <br><br>
           <label for="dob">date of birth:</label>
           <input type="date" id="dob" ><br>
           <br>
           <label for="course">course:</label><br>
           <select id="course">
            <option value="ssc">ssc</option>
            <option value="inter">inter</option>
            <option value="degree">degree</option>
            <option value="pg">pg</option>
           </select>
           <br><br>
           <label for="msg">message:</label><br>
           <textarea type="text" id="msg" placeholder="enter message" rows="4" cols="50"></textarea>
           <br><br>
           <input type="checkbox">
           i have read terms and conditions
            <br><br>
            <button type="submit">REGISTEER</button>
            <button type="reset">CLEAR</button>
        </form>
    </body>
</html>
