<html>
    <head><title>sign up form</title></head>
    
        <link rel="stylesheet" href="style.css">
        <script src="sign up form/script.js"></script>
    <body>
    <div class="fullcontainer">
   
        <div class="head">

          <h1>Create Account</h1>
        </div>
        <div class="container">
        
            <h4 class="sub">Sign up to get started</h4>
         
        <form>
            <div class="size">
            <input type="text" id="name" placeholder="Full Name"><br><br>
            <input type="email" id="email" placeholder="Email Address"><br><br>
            <input type="tel" id="tel" placeholder="Phone Number"><br><br>
            <input type="password" id="password" placeholder="Password"><br><br>
            <label for="cofirm"></label>
            <input type="password" id="Confirm" placeholder="Confirm Password"><br><br>
            </div>
            <input type="checkbox"> i agree to the <span style="color:blue">Terms & Conditions</span><br><br>
            <button type="submit"> Sign Up </button>
        </form>
        <p>or</p>
        <div class="login">
            <p>Already have an account? </p>
           <button> <a href="#Login">Login</a></button>
        </div>
         </div>
    </div>
    <p id="message"></p>
        
    </body>
</html>
